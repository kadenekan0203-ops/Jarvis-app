<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:#00ffe7;--c2:#00b8a4;--bg:#030d0b;--bd:rgba(0,255,231,0.18);--bd2:rgba(0,255,231,0.4);--txt:#b8fff8;--txt2:rgba(184,255,248,0.5);--s2:rgba(0,40,34,0.8);--green:#06ffa5;--red:#ff4d6d;--amber:#ffb703;--violet:#c77dff;--rose:#ff6b9d;--sky:#60dfff}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:sans-serif}
.shell{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse 70% 35% at 50% -5%,rgba(0,255,231,0.09),transparent),var(--bg);position:relative}
.shell::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,255,231,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,231,0.025) 1px,transparent 1px);background-size:36px 36px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:rgba(3,13,11,0.95);position:relative;z-index:10}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:14px;letter-spacing:5px;color:var(--c);text-shadow:0 0 18px rgba(0,255,231,0.4)}
.hdr-right{display:flex;align-items:center;gap:8px}
.badge{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--c2);background:rgba(0,255,231,0.06);border:1px solid var(--bd);border-radius:4px;padding:3px 7px}
.online{display:flex;align-items:center;gap:4px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--txt2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.tabs{display:flex;gap:2px;padding:7px 10px;background:rgba(3,13,11,0.8);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;position:relative;z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:5px 11px;border-radius:6px;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1.5px;color:var(--txt2);border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none;transition:all 0.2s}
.tab.active{color:var(--c);background:rgba(0,255,231,0.1);border-color:var(--bd2)}
.content{flex:1;overflow-y:auto;padding:12px 12px 90px;position:relative;z-index:5}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:0.3}
.card.v::before{background:linear-gradient(90deg,transparent,var(--violet),transparent)}
.card.r::before{background:linear-gradient(90deg,transparent,var(--rose),transparent)}
.sec{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:var(--c2);margin-bottom:8px}
.sec.v{color:rgba(199,125,255,0.8)}
.sec.r{color:rgba(255,107,157,0.8)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 5px;text-align:center}
.stat-n{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--c)}
.stat-l{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt2);margin-top:2px}
.bot{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden;transition:border-color 0.2s}
.bot.running::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--green),transparent)}
.bot.paused::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber)}
.bot.stopped::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red)}
.bot-row{display:flex;gap:10px;align-items:flex-start}
.bot-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.bot-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:700}
.bot-sub{font-family:'Share Tech Mono',monospace;font-size:9px;margin-top:2px}
.bot-desc{font-size:10px;color:var(--txt2);margin-top:2px}
.ctrls{display:flex;gap:4px}
.ctrl{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:rgba(0,255,231,0.06);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:all 0.15s}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bstat{background:rgba(0,255,231,0.06);border-radius:6px;padding:6px 8px}
.bstat-v{font-family:'Share Tech Mono',monospace;font-size:12px;font-weight:600}
.bstat-l{font-size:9px;color:var(--txt2);margin-top:1px}
.bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;border-radius:2px;transition:width 0.6s}
.bar-lbl{display:flex;justify-content:space-between;margin-top:3px}
.bar-lbl span{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--txt2)}
.alert-item{display:flex;gap:8px;background:rgba(0,255,231,0.04);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-bottom:5px;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.alert-txt{font-size:12px;line-height:1.4}
.alert-time{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--txt2);margin-top:2px}
.msgs{flex:1;overflow-y:auto;padding-bottom:8px}
.msg{display:flex;gap:8px;margin-bottom:10px;animation:fadeIn 0.2s ease}
.msg.user{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;border:1px solid var(--bd2);background:rgba(0,255,231,0.08);color:var(--c);flex-shrink:0}
.msg.user .av{background:rgba(199,125,255,0.15);border-color:rgba(199,125,255,0.5);color:var(--violet)}
.bubble{max-width:78%;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.55}
.msg.user .bubble{background:rgba(199,125,255,0.08);border-color:rgba(199,125,255,0.25)}
.chat-bar{display:flex;gap:6px;align-items:center;padding-top:10px;border-top:1px solid var(--bd);margin-top:6px}
.chat-in{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--txt);font-size:13px;outline:none}
.chat-in:focus{border-color:var(--bd2)}
.chat-in::placeholder{color:var(--txt2)}
.mic-btn{width:40px;height:40px;border-radius:8px;background:rgba(0,255,231,0.08);border:1px solid var(--bd2);cursor:pointer;font-size:16px;flex-shrink:0;transition:all 0.2s}
.mic-btn.listening{background:rgba(255,77,109,0.2);border-color:rgba(255,77,109,0.6);animation:blink 0.5s infinite}
.send-btn{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--c),var(--c2));border:none;cursor:pointer;font-size:16px;flex-shrink:0}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.think{display:flex;gap:3px;align-items:center;padding:4px 0}
.think span{width:5px;height:5px;border-radius:50%;background:var(--c2);animation:th 1s infinite;display:inline-block}
.think span:nth-child(2){animation-delay:0.2s}
.think span:nth-child(3){animation-delay:0.4s}
@keyframes th{0%,80%,100%{transform:scale(0.6);opacity:0.3}40%{transform:scale(1);opacity:1}}
.habit{background:rgba(0,255,231,0.04);border:1px solid var(--bd);border-radius:8px;padding:10px;cursor:pointer;position:relative;transition:all 0.2s}
.habit.done{border-color:rgba(6,255,165,0.5);background:rgba(6,255,165,0.07)}
.mood-btn{padding:7px 11px;border-radius:20px;border:1px solid var(--bd);background:rgba(0,255,231,0.04);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;margin:3px;transition:all 0.2s}
.mood-btn.sel{border-color:rgba(199,125,255,0.5);background:rgba(199,125,255,0.12)}
.inp{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;color:var(--txt);font-size:13px;outline:none;flex:1}
.inp:focus{border-color:var(--bd2)}
.inp::placeholder{color:var(--txt2)}
.log-btn{padding:9px 13px;border-radius:7px;border:1px solid var(--bd2);background:rgba(0,255,231,0.08);color:var(--c);font-family:'Orbitron',monospace;font-size:9px;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.row{display:flex;gap:6px;margin-top:7px;align-items:center}
.affirm{background:linear-gradient(135deg,rgba(199,125,255,0.1),rgba(96,223,255,0.06));border:1px solid rgba(199,125,255,0.3);border-radius:12px;padding:18px;text-align:center;margin-bottom:10px}
.entry{background:rgba(0,255,231,0.04);border-radius:7px;padding:9px 11px;margin-top:6px}
.entry-date{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--txt2);margin-bottom:3px}
.entry-text{font-size:12px;line-height:1.5}
.big-num{font-family:'Orbitron',monospace;font-size:36px;font-weight:700}
.bnav{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--bd);background:rgba(3,13,11,0.96);backdrop-filter:blur(14px);z-index:20}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 14px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--txt2);background:none;border:none;transition:color 0.2s}
.bnav-btn.active{color:var(--c)}
.bnav-icon{font-size:19px;line-height:1}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,255,231,0.1),transparent);pointer-events:none;z-index:999;animation:scan 6s linear infinite;opacity:0.5}
@keyframes scan{from{top:0}to{top:100%}}
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.type-btn{padding:10px;border-radius:8px;border:1px solid var(--bd);background:rgba(0,255,231,0.04);cursor:pointer;text-align:center;transition:all 0.2s}
.type-btn.sel{border-color:var(--bd2);background:rgba(0,255,231,0.1)}
.field{margin-bottom:10px}
.field-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--c2);margin-bottom:5px}
.deploy-btn{width:100%;padding:14px;border-radius:9px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--c),var(--c2));font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;font-weight:700;color:#030d0b;margin-top:6px;transition:opacity 0.2s}
.deploy-btn:hover{opacity:0.88}
.sub-tabs{display:flex;gap:4px;margin-bottom:12px}
.sub-tab{flex:1;padding:7px 4px;text-align:center;border-radius:7px;cursor:pointer;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;transition:all 0.2s}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="shell" id="app">
  <div class="hdr">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="hdr-right">
      <div class="badge" id="clock">--:--</div>
      <div class="online"><div class="dot"></div><span id="online-count">2/4</span></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
  <nav class="bnav" id="bnav"></nav>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
let S = {
  tab: 'dash',
  selfSub: 'body',
  newBotType: 'trading',
  aiLoading: false,
  bots: [
    {id:1,name:'ALPHA TRADER',type:'TRADING',emoji:'📈',status:'running',platform:'Freqtrade',desc:'BTC/ETH swing strategy',health:78,color:'#ffd166',bg:'rgba(255,209,102,0.12)',stats:[{v:'+£342',l:'P&L'},{v:'84',l:'Trades'},{v:'67%',l:'Win%'}]},
    {id:2,name:'SOCIAL HAWK',type:'SOCIAL',emoji:'🦅',status:'running',platform:'Custom API',desc:'Twitter/X engagement',health:91,color:'#c77dff',bg:'rgba(199,125,255,0.12)',stats:[{v:'24',l:'Posts'},{v:'4.2K',l:'Reach'},{v:'61',l:'Replies'}]},
    {id:3,name:'SUPPORT BOT',type:'SERVICE',emoji:'🤝',status:'paused',platform:'ManyChat',desc:'Customer service auto',health:55,color:'#06ffa5',bg:'rgba(6,255,165,0.12)',stats:[{v:'12',l:'Open'},{v:'89%',l:'Solved'},{v:'4.7★',l:'CSAT'}]},
    {id:4,name:'DATA SPIDER',type:'SCRAPER',emoji:'🕷️',status:'stopped',platform:'Custom',desc:'Price monitor',health:0,color:'#ff9f1c',bg:'rgba(255,159,28,0.12)',stats:[{v:'0',l:'Scraped'},{v:'8',l:'Sources'},{v:'14K',l:'Records'}]},
  ],
  alerts: [
    {id:1,icon:'✅',text:'ALPHA TRADER: Take-profit on ETH at £2,341',time:'2 min ago',col:'rgba(6,255,165,0.3)'},
    {id:2,icon:'⚠️',text:'SUPPORT BOT: Queue depth >10',time:'8 min ago',col:'rgba(255,183,3,0.3)'},
    {id:3,icon:'🔴',text:'DATA SPIDER: Connection timeout',time:'15 min ago',col:'rgba(255,77,109,0.3)'},
  ],
  msgs: [{role:'j',text:'All systems online, sir. Bot fleet and personal metrics are visible. Speak or type your command.'}],
  mood:'', steps:6400, water:1.5, medStreak:7, intention:'',
  habits:[
    {name:'COLD SHOWER',emoji:'🚿',done:false,streak:5},
    {name:'NO PHONE AM',emoji:'📵',done:true,streak:3},
    {name:'READ 20MIN',emoji:'📚',done:false,streak:12},
    {name:'EXERCISE',emoji:'💪',done:true,streak:8},
    {name:'MEDITATE',emoji:'🧘',done:false,streak:2},
    {name:'JOURNAL',emoji:'✍️',done:false,streak:1},
  ],
  journal:[], gratitude:[], affIdx:0,
};

const AFFIRMATIONS = [
  '"I am building an empire from the inside out. My discipline today is my legacy tomorrow."',
  '"My mind is sharp, my body is strong, my spirit is unshakeable."',
  '"I operate with purpose. I rest with intention. I rise with gratitude."',
  '"I am not chasing success — I am becoming the kind of person success finds."',
  '"Every system I build reflects the order within me."',
];

const REFLECTIONS = [
  'What drained your energy today, and how can you protect against it tomorrow?',
  'Name one thing you\'re grateful for that you usually take for granted.',
  'What would you tell yourself 5 years ago?',
  'Where are you making progress that you haven\'t acknowledged yet?',
];

const NAV = [{k:'dash',i:'⬡',l:'HQ'},{k:'brain',i:'◈',l:'JARVIS'},{k:'self',i:'◉',l:'SELF'},{k:'create',i:'⊕',l:'DEPLOY'},{k:'alerts',i:'△',l:'ALERTS'}];

// ══════════════════════════════════════════════════════════════════
// CLOCK
// ══════════════════════════════════════════════════════════════════
function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick,10000);

function dateStr(){return new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function hc(h){return h>70?'var(--green)':h>30?'var(--amber)':'var(--red)'}

// ══════════════════════════════════════════════════════════════════
// VOICE
// ══════════════════════════════════════════════════════════════════
let recognition = null;
let isListening = false;

function toggleVoice(){
  if(isListening){ stopListening(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice input requires Safari on iPhone or Chrome on Android.'); return; }
  recognition = new SR();
  recognition.lang = 'en-GB';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = ()=>{
    isListening = true;
    const b = document.getElementById('mic-btn');
    if(b){ b.classList.add('listening'); b.textContent='🔴'; }
  };
  recognition.onresult = e=>{
    const text = e.results[0][0].transcript;
    const inp = document.getElementById('chat-inp');
    if(inp) inp.value = text;
    stopListening();
    sendMsg();
  };
  recognition.onerror = ()=>stopListening();
  recognition.onend = ()=>stopListening();
  recognition.start();
}

function stopListening(){
  isListening = false;
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; }
  const b = document.getElementById('mic-btn');
  if(b){ b.classList.remove('listening'); b.textContent='🎙️'; }
}

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*_`#\[\]]/g,'').substring(0,400);
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = 'en-GB';
  utt.rate = 0.88;
  utt.pitch = 0.75;
  utt.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v=>v.name.includes('Daniel')||v.name.includes('Google UK English Male')||v.name.includes('Alex'));
  if(pref) utt.voice = pref;
  window.speechSynthesis.speak(utt);
}

// ══════════════════════════════════════════════════════════════════
// AI
// ══════════════════════════════════════════════════════════════════
async function sendMsg(){
  const inp = document.getElementById('chat-inp');
  if(!inp || !inp.value.trim() || S.aiLoading) return;
  const text = inp.value.trim();
  inp.value = '';
  S.msgs.push({role:'u', text});
  S.aiLoading = true;
  render();

  try{
    const botInfo = S.bots.map(b=>({name:b.name,status:b.status,health:b.health,type:b.type}));
    const sys = `You are J.A.R.V.I.S. — personal AI command system.
Bot fleet: ${JSON.stringify(botInfo)}
Personal stats: mood="${S.mood||'unknown'}", steps=${S.steps}, water=${S.water}L, medStreak=${S.medStreak} days, habits done=${S.habits.filter(h=>h.done).length}/${S.habits.length}
Personality: precise, dry wit, address user as "sir". Keep responses concise (2-3 sentences max unless detail needed).
You can control bots — end response with [ACTION:{"botId":N,"action":"start|pause|stop"}]
You can suggest the user switch tabs — say things like "I'd recommend checking your SELF tab" or "Head to the DEPLOY tab to add that bot."`;

    const history = S.msgs.filter(m=>m.role!=='j').slice(-8).map(m=>({role:'user',content:m.text}));
    const assistantMsgs = S.msgs.filter(m=>m.role==='j').slice(-8).map(m=>({role:'assistant',content:m.text}));
    
    const allMsgs = [];
    S.msgs.slice(-16).forEach(m=>{
      allMsgs.push({role: m.role==='u'?'user':'assistant', content: m.text});
    });

    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:allMsgs})
    });
    const d = await r.json();
    const reply = d.content?.map(b=>b.text||'').join('') || 'Systems unavailable, sir.';

    // Parse bot action
    const am = reply.match(/\[ACTION:({.*?})\]/);
    if(am){ try{ const a=JSON.parse(am[1]); botCtrl(a.botId,a.action,true); }catch(e){} }

    const clean = reply.replace(/\[ACTION:.*?\]/g,'').trim();
    S.msgs.push({role:'j', text:clean});
    speak(clean);
  } catch(e){
    S.msgs.push({role:'j', text:'System error, sir. Please try again.'});
    speak('System error, sir.');
  }
  S.aiLoading = false;
  render();
  setTimeout(()=>{ const e=document.getElementById('msgs-end'); if(e) e.scrollIntoView({behavior:'smooth'}); },100);
}

// ══════════════════════════════════════════════════════════════════
// BOT CONTROL
// ══════════════════════════════════════════════════════════════════
function botCtrl(id, action, silent=false){
  id = parseInt(id);
  S.bots = S.bots.map(b=>{
    if(b.id!==id) return b;
    const n={...b};
    if(action==='start'){n.status='running';n.health=Math.max(n.health,40);}
    if(action==='pause') n.status='paused';
    if(action==='stop'){n.status='stopped';n.health=0;}
    return n;
  });
  if(!silent){
    const icons={start:'▶️',pause:'⏸️',stop:'⏹️'};
    const labels={start:'started',pause:'paused',stop:'stopped'};
    const bot = S.bots.find(b=>b.id===id);
    if(bot){
      const col = action==='start'?'rgba(6,255,165,0.3)':action==='pause'?'rgba(255,183,3,0.3)':'rgba(255,77,109,0.3)';
      S.alerts.unshift({id:Date.now(),icon:icons[action],text:`${bot.name} ${labels[action]}.`,time:'just now',col});
    }
  }
  const running = S.bots.filter(b=>b.status==='running').length;
  const el = document.getElementById('online-count');
  if(el) el.textContent = `${running}/${S.bots.length}`;
  render();
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function setTab(t){ S.tab=t; render(); window.scrollTo(0,0); }
function setSelfSub(s){ S.selfSub=s; render(); }

function botHTML(b){
  const hColor = hc(b.health);
  return `<div class="bot ${b.status}">
    <div class="bot-row">
      <div class="bot-icon" style="background:${b.bg}">${b.emoji}</div>
      <div style="flex:1;min-width:0">
        <div class="bot-name">${b.name}</div>
        <div class="bot-sub" style="color:${b.color}">${b.type} · ${b.platform}</div>
        <div class="bot-desc">${b.desc}</div>
      </div>
      <div class="ctrls">
        ${b.status!=='running'?`<div class="ctrl" style="color:var(--green);border-color:rgba(6,255,165,0.4)" onclick="botCtrl(${b.id},'start')">▶</div>`:''}
        ${b.status==='running'?`<div class="ctrl" style="color:var(--amber);border-color:rgba(255,183,3,0.4)" onclick="botCtrl(${b.id},'pause')">⏸</div>`:''}
        ${b.status!=='stopped'?`<div class="ctrl" style="color:var(--red);border-color:rgba(255,77,109,0.4)" onclick="botCtrl(${b.id},'stop')">⏹</div>`:''}
      </div>
    </div>
    <div class="bstats">
      ${b.stats.map(s=>`<div class="bstat"><div class="bstat-v" style="color:${b.color}">${s.v}</div><div class="bstat-l">${s.l}</div></div>`).join('')}
    </div>
    <div class="bar"><div class="bar-fill" style="width:${b.health}%;background:${hColor}"></div></div>
    <div class="bar-lbl"><span>HEALTH</span><span style="color:${hColor}">${b.health}%</span></div>
  </div>`;
}

function renderDash(){
  const r=S.bots.filter(b=>b.status==='running').length;
  const p=S.bots.filter(b=>b.status==='paused').length;
  const s=S.bots.filter(b=>b.status==='stopped').length;
  return `
  <div class="stat-row">
    <div class="stat"><div class="stat-n">${S.bots.length}</div><div class="stat-l">TOTAL</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--green)">${r}</div><div class="stat-l">ACTIVE</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--amber)">${p}</div><div class="stat-l">PAUSED</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--red)">${s}</div><div class="stat-l">OFFLINE</div></div>
  </div>
  <div class="sec">BOT FLEET</div>
  ${S.bots.map(botHTML).join('')}
  <div class="sec" style="margin-top:8px">LIVE ALERTS</div>
  ${S.alerts.slice(0,6).map(a=>`<div class="alert-item" style="border-color:${a.col||'var(--bd)'}"><div style="font-size:14px;flex-shrink:0">${a.icon}</div><div><div class="alert-txt">${a.text}</div><div class="alert-time">${a.time}</div></div></div>`).join('')}`;
}

function renderBrain(){
  const msgs = S.msgs.map(m=>`
    <div class="msg ${m.role==='u'?'user':''}">
      <div class="av">${m.role==='u'?'K':'J'}</div>
      <div class="bubble">${m.text}</div>
    </div>`).join('');
  const loading = S.aiLoading?`<div class="msg"><div class="av">J</div><div class="bubble"><div class="think"><span></span><span></span><span></span></div></div></div>`:'';
  return `<div style="display:flex;flex-direction:column;height:calc(100dvh - 185px)">
    <div class="msgs" style="flex:1;overflow-y:auto;padding-bottom:8px">${msgs}${loading}<div id="msgs-end"></div></div>
    <div class="chat-bar">
      <input class="chat-in" id="chat-inp" placeholder="Speak or type a command..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"/>
      <button id="mic-btn" class="mic-btn" onclick="toggleVoice()" title="Voice command">🎙️</button>
      <button class="send-btn" onclick="sendMsg()" ${S.aiLoading?'disabled':''}>➤</button>
    </div>
  </div>`;
}

function renderSelf(){
  const sub = S.selfSub;
  const subTabs = `<div class="sub-tabs">
    ${[['body','💪 BODY'],['mind','🧠 MIND'],['spirit','✨ SPIRIT']].map(([k,l])=>`
    <div class="sub-tab" onclick="setSelfSub('${k}')" style="background:${sub===k?'rgba(199,125,255,0.12)':'rgba(0,255,231,0.04)'};border:1px solid ${sub===k?'rgba(199,125,255,0.5)':'var(--bd)'};color:${sub===k?'var(--violet)':'var(--txt2)'}">
      ${l}
    </div>`).join('')}
  </div>`;

  let body = '';

  if(sub==='body') body = `
    <div class="card">
      <div class="sec">STEPS · ${(S.steps/1000).toFixed(1)}k / 10k</div>
      <div class="bar"><div class="bar-fill" style="width:${Math.min(S.steps/10000*100,100)}%;background:var(--green)"></div></div>
      <div style="font-size:10px;color:var(--txt2);margin-top:4px">${S.steps>=10000?'🎯 Goal reached, sir!':Math.round(S.steps/10000*100)+'% of daily goal'}</div>
      <div class="row"><button onclick="S.steps=Math.max(0,S.steps-1000);render()" style="flex:1;padding:9px;border-radius:7px;border:1px solid var(--bd);background:rgba(0,255,231,0.06);color:var(--c);cursor:pointer;font-family:'Orbitron',monospace;font-size:10px">−1k</button><button onclick="S.steps+=1000;render()" style="flex:1;padding:9px;border-radius:7px;border:1px solid var(--bd);background:rgba(0,255,231,0.06);color:var(--c);cursor:pointer;font-family:'Orbitron',monospace;font-size:10px">+1k</button></div>
    </div>
    <div class="card">
      <div class="sec">WATER · ${S.water}L / 2.5L</div>
      <div class="bar"><div class="bar-fill" style="width:${Math.min(S.water/2.5*100,100)}%;background:var(--sky)"></div></div>
      <div style="font-size:10px;color:var(--txt2);margin-top:4px">${S.water>=2.5?'🎯 Hydration goal reached!':((2.5-S.water).toFixed(1))+'L remaining'}</div>
      <div class="row"><button onclick="S.water=Math.max(0,parseFloat((S.water-0.25).toFixed(2)));render()" style="flex:1;padding:9px;border-radius:7px;border:1px solid var(--bd);background:rgba(0,255,231,0.06);color:var(--c);cursor:pointer;font-family:'Orbitron',monospace;font-size:10px">−250ml</button><button onclick="S.water=parseFloat((S.water+0.25).toFixed(2));render()" style="flex:1;padding:9px;border-radius:7px;border:1px solid var(--bd);background:rgba(0,255,231,0.06);color:var(--c);cursor:pointer;font-family:'Orbitron',monospace;font-size:10px">+250ml</button></div>
    </div>`;

  if(sub==='mind') body = `
    <div class="card v">
      <div class="sec v">MOOD CHECK-IN</div>
      <div>${[['😤','Fired Up'],['😌','Calm'],['😊','Good'],['😐','Neutral'],['😔','Low'],['🔥','Motivated'],['😴','Tired'],['😤','Stressed']].map(([e,l])=>`<span class="mood-btn ${S.mood===l?'sel':''}" onclick="S.mood='${l}';render()">${e} <span style="font-size:10px;color:var(--txt2)">${l}</span></span>`).join('')}</div>
      ${S.mood?`<div style="margin-top:8px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--violet)">Current state: ${S.mood}</div>`:''}
    </div>
    <div class="card v">
      <div class="sec v">DAILY HABITS</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
        ${S.habits.map((h,i)=>`<div class="habit ${h.done?'done':''}" onclick="S.habits[${i}].done=!S.habits[${i}].done;render()">
          <div style="font-size:20px;margin-bottom:4px">${h.emoji}</div>
          <div style="font-family:'Orbitron',monospace;font-size:9px;letter-spacing:0.5px">${h.name}</div>
          <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--txt2);margin-top:2px">🔥 ${h.streak} streak</div>
          ${h.done?'<div style="position:absolute;top:7px;right:9px;font-size:12px;color:var(--green)">✓</div>':''}
        </div>`).join('')}
      </div>
    </div>
    <div class="card v">
      <div class="sec v">JOURNAL</div>
      <div style="font-size:11px;color:var(--violet);font-style:italic;margin-bottom:8px;padding:9px 11px;background:rgba(199,125,255,0.07);border-radius:7px;border:1px solid rgba(199,125,255,0.2)">
        💭 ${REFLECTIONS[S.refIdx||0]}
        <div onclick="S.refIdx=((S.refIdx||0)+1)%${REFLECTIONS.length};render()" style="margin-top:5px;cursor:pointer;font-size:9px;color:rgba(199,125,255,0.6)">next prompt →</div>
      </div>
      <div class="row"><input class="inp" id="j-inp" placeholder="Write your thoughts..."/><button class="log-btn" style="background:rgba(199,125,255,0.1);border-color:rgba(199,125,255,0.4);color:var(--violet)" onclick="logJournal()">SAVE</button></div>
      ${S.journal.map(j=>`<div class="entry" style="border:1px solid rgba(199,125,255,0.2)"><div class="entry-date">${j.date}</div><div class="entry-text">${j.text}</div></div>`).join('')}
    </div>`;

  if(sub==='spirit') body = `
    <div class="affirm">
      <div style="font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;color:rgba(199,125,255,0.6);margin-bottom:9px">✨ TODAY'S AFFIRMATION</div>
      <div style="font-size:14px;line-height:1.65;font-style:italic;color:var(--txt)">${AFFIRMATIONS[S.affIdx]}</div>
      <div onclick="S.affIdx=(S.affIdx+1)%${AFFIRMATIONS.length};render()" style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--violet);cursor:pointer;margin-top:10px;display:inline-block;border:1px solid rgba(199,125,255,0.3);padding:4px 12px;border-radius:4px;background:rgba(199,125,255,0.07)">↻ NEW AFFIRMATION</div>
    </div>
    <div class="card r">
      <div class="sec r">DAILY INTENTION</div>
      <input class="inp" style="width:100%" id="int-inp" placeholder="Today I intend to..." value="${S.intention.replace(/"/g,'&quot;')}" oninput="S.intention=this.value;render()"/>
      ${S.intention?`<div style="margin-top:8px;padding:9px 11px;background:rgba(255,107,157,0.07);border:1px solid rgba(255,107,157,0.25);border-radius:7px;font-size:12px;font-style:italic;color:var(--txt)">🎯 "${S.intention}"</div>`:''}
    </div>
    <div class="card r">
      <div class="sec r">MEDITATION STREAK</div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="big-num" style="color:var(--rose)">${S.medStreak}</div>
        <div>
          <div style="font-size:11px;color:var(--txt2)">days consecutive</div>
          <div style="font-size:10px;color:var(--rose);margin-top:2px">${S.medStreak>=21?'Master level, sir.':S.medStreak>=7?'Excellent consistency.':'Building momentum.'}</div>
          <div class="row" style="margin-top:8px">
            <button onclick="S.medStreak++;render()" style="padding:7px 14px;border-radius:7px;border:1px solid rgba(255,107,157,0.4);background:rgba(255,107,157,0.1);color:var(--rose);cursor:pointer;font-family:'Orbitron',monospace;font-size:9px">✓ LOG SESSION</button>
            <button onclick="S.medStreak=Math.max(0,S.medStreak-1);render()" style="padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:rgba(0,255,231,0.06);color:var(--txt2);cursor:pointer;font-family:'Orbitron',monospace;font-size:9px">−</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card r">
      <div class="sec r">GRATITUDE LOG</div>
      <div class="row"><input class="inp" id="g-inp" placeholder="Today I'm grateful for..."/><button class="log-btn" style="background:rgba(255,107,157,0.1);border-color:rgba(255,107,157,0.4);color:var(--rose)" onclick="logGrat()">ADD</button></div>
      ${S.gratitude.map(g=>`<div class="entry" style="border:1px solid rgba(255,107,157,0.2)"><div class="entry-date">${g.date}</div><div class="entry-text">🙏 ${g.text}</div></div>`).join('')}
    </div>
    <div class="card r">
      <div class="sec r">CORE PILLARS</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
        ${[['🧠','Mindset','Growing'],['💪','Discipline','Strong'],['🤲','Gratitude',S.gratitude.length+' entries'],['🔥','Purpose',S.intention?'Set':'Not set'],['☯️','Balance','Tracking'],['🌱','Growth','Daily']].map(([e,l,v])=>`
        <div style="background:rgba(255,107,157,0.06);border:1px solid rgba(255,107,157,0.2);border-radius:8px;padding:9px 10px">
          <div style="font-size:18px;margin-bottom:3px">${e}</div>
          <div style="font-family:'Orbitron',monospace;font-size:9px;color:var(--rose);letter-spacing:1px">${l}</div>
          <div style="font-size:10px;color:var(--txt2);margin-top:2px">${v}</div>
        </div>`).join('')}
      </div>
    </div>`;

  return subTabs + body;
}

function renderCreate(){
  const types = [['trading','📈','#ffd166'],['social','🦅','#c77dff'],['service','🤝','#06ffa5'],['scraper','🕷️','#ff9f1c']];
  return `
  <div class="sec">DEPLOY NEW BOT</div>
  <div class="type-grid">
    ${types.map(([k,e,c])=>`<div class="type-btn ${S.newBotType===k?'sel':''}" onclick="S.newBotType='${k}';render()">
      <div style="font-size:22px;margin-bottom:5px">${e}</div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:${c}">${k.toUpperCase()}</div>
    </div>`).join('')}
  </div>
  <div class="field"><div class="field-label">BOT NAME</div><input class="inp" style="width:100%" id="nb-name" placeholder="e.g. MOMENTUM SCALPER"/></div>
  <div class="field"><div class="field-label">PLATFORM / INTEGRATION</div><input class="inp" style="width:100%" id="nb-plat" placeholder="e.g. Freqtrade, ManyChat, Custom API"/></div>
  <div class="field"><div class="field-label">DESCRIPTION</div><input class="inp" style="width:100%" id="nb-desc" placeholder="What does this bot do?"/></div>
  <button class="deploy-btn" onclick="deployBot()">⚡ DEPLOY BOT</button>`;
}

function renderAlerts(){
  return `
  <div class="sec">SYSTEM ALERTS <span style="color:var(--txt2);font-size:9px">${S.alerts.length} events</span></div>
  ${S.alerts.length===0?'<div style="text-align:center;padding:30px 0;color:var(--txt2);font-size:13px">All clear, sir. No alerts.</div>':''}
  ${S.alerts.map(a=>`<div class="alert-item" style="border-color:${a.col||'var(--bd)'}">
    <div style="font-size:14px;flex-shrink:0">${a.icon}</div>
    <div><div class="alert-txt">${a.text}</div><div class="alert-time">${a.time}</div></div>
  </div>`).join('')}`;
}

function render(){
  const map = {dash:renderDash, brain:renderBrain, self:renderSelf, create:renderCreate, alerts:renderAlerts};
  document.getElementById('content').innerHTML = (map[S.tab]||renderDash)();
  document.getElementById('tabs').innerHTML = NAV.map(n=>`<div class="tab ${S.tab===n.k?'active':''}" onclick="setTab('${n.k}')">${n.i} ${n.l}</div>`).join('');
  document.getElementById('bnav').innerHTML = NAV.map(n=>`<button class="bnav-btn ${S.tab===n.k?'active':''}" onclick="setTab('${n.k}')"><span class="bnav-icon">${n.i}</span>${n.l}</button>`).join('');
  const running = S.bots.filter(b=>b.status==='running').length;
  document.getElementById('online-count').textContent = `${running}/${S.bots.length}`;
}

// ══════════════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════════════
function logJournal(){
  const inp = document.getElementById('j-inp');
  if(inp && inp.value.trim()){
    S.journal.unshift({text:inp.value.trim(), date:dateStr()});
    S.journal = S.journal.slice(0,5);
    render();
  }
}

function logGrat(){
  const inp = document.getElementById('g-inp');
  if(inp && inp.value.trim()){
    S.gratitude.unshift({text:inp.value.trim(), date:dateStr()});
    S.gratitude = S.gratitude.slice(0,5);
    render();
  }
}

function deployBot(){
  const name = document.getElementById('nb-name')?.value?.trim();
  const plat = document.getElementById('nb-plat')?.value?.trim();
  const desc = document.getElementById('nb-desc')?.value?.trim();
  if(!name || !plat){ alert('Please fill in bot name and platform.'); return; }
  const map = {
    trading:{e:'📈',c:'#ffd166',bg:'rgba(255,209,102,0.12)'},
    social:{e:'🦅',c:'#c77dff',bg:'rgba(199,125,255,0.12)'},
    service:{e:'🤝',c:'#06ffa5',bg:'rgba(6,255,165,0.12)'},
    scraper:{e:'🕷️',c:'#ff9f1c',bg:'rgba(255,159,28,0.12)'}
  };
  const t = map[S.newBotType];
  S.bots.push({
    id:Date.now(), name:name.toUpperCase(), type:S.newBotType.toUpperCase(),
    emoji:t.e, status:'stopped', platform:plat, desc:desc||'New bot',
    health:0, color:t.c, bg:t.bg,
    stats:[{v:'0',l:'Tasks'},{v:'0',l:'Runs'},{v:'0',l:'Errors'}]
  });
  S.alerts.unshift({id:Date.now(),icon:'🚀',text:`Deployed: ${name.toUpperCase()} on ${plat}`,time:'just now',col:'rgba(6,255,165,0.3)'});
  setTab('dash');
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
render();
</script>
</body>
</html>
